<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" width="400" height="214" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <!-- Window -->
  <rect x="0.5" y="0.5" width="399" height="213" rx="6" fill="#ffffff" stroke="#9aa3ae"/>
  <path d="M 0.5 26 L 399.5 26" stroke="#c9ced6"/>
  <text x="12" y="18" fill="#1f2933">Brother PT-P900W Printing Preferences</text>
  <!-- Tabs -->
  <rect x="12" y="34" width="56" height="22" fill="#ffffff" stroke="#9aa3ae"/>
  <path d="M 13 56 L 67 56" stroke="#ffffff" stroke-width="2"/>
  <text x="40" y="50" text-anchor="middle" fill="#1f2933" font-weight="bold">Basic</text>
  <text x="102" y="50" text-anchor="middle" fill="#5b6472">Advanced</text>
  <path d="M 12 56 L 388 56" stroke="#9aa3ae"/>
  <!-- Tape width -->
  <text x="24" y="82" fill="#1f2933">Tape width</text>
  <rect x="130" y="68" width="90" height="20" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="138" y="82" fill="#1d4ed8" font-weight="bold">24 mm</text>
  <path d="M 206 75 l 4 5 l 4 -5" fill="none" stroke="#1d4ed8"/>
  <!-- Length -->
  <text x="24" y="108" fill="#1f2933">Length</text>
  <rect x="130" y="94" width="90" height="20" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="138" y="108" fill="#1d4ed8" font-weight="bold">26 mm</text>
  <text x="228" y="108" fill="#5b6472" font-size="11">= the Tape Size's length</text>
  <!-- Margin -->
  <text x="24" y="134" fill="#1f2933">Margin (feed)</text>
  <rect x="130" y="120" width="90" height="20" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="138" y="134" fill="#1d4ed8" font-weight="bold">smallest</text>
  <path d="M 206 127 l 4 5 l 4 -5" fill="none" stroke="#1d4ed8"/>
  <!-- Cut options -->
  <text x="24" y="160" fill="#1f2933">Cut options</text>
  <rect x="130" y="149" width="12" height="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <path d="M 132 155 l 3 3 l 5 -6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="148" y="160" fill="#1d4ed8" font-weight="bold">Auto cut</text>
  <rect x="210" y="149" width="12" height="12" fill="#ffffff" stroke="#5b6472"/>
  <text x="228" y="160" fill="#5b6472">Half cut</text>
  <rect x="284" y="149" width="12" height="12" fill="#ffffff" stroke="#5b6472"/>
  <text x="302" y="160" fill="#5b6472">Chain printing</text>
  <!-- Buttons -->
  <rect x="166" y="180" width="66" height="22" rx="3" fill="#ffffff" stroke="#5b6472"/>
  <text x="199" y="195" text-anchor="middle" fill="#1f2933">OK</text>
  <rect x="242" y="180" width="66" height="22" rx="3" fill="#ffffff" stroke="#5b6472"/>
  <text x="275" y="195" text-anchor="middle" fill="#1f2933">Cancel</text>
  <rect x="318" y="180" width="66" height="22" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="351" y="195" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Apply</text>
</svg>
