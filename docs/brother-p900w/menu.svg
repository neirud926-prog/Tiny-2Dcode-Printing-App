<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 128" width="400" height="128" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect x="0.5" y="0.5" width="399" height="127" rx="6" fill="#f6f7f9" stroke="#c9ced6"/>
