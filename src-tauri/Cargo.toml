[package]
name = "tiny-2dcode"
version = "0.1.1"
description = "2D Code Print: GS1 DataMatrix labels with an Internal GTIN, Expiry and Lot"
authors = ["Wong Fuk Wing"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# GetComputerNameExW: the DNS host name, which Node's os.hostname() gives the Electron app.
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
