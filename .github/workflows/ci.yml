name: CI

# Every push and pull request: tests, then the Windows Tauri .exe (WebView2) as a workflow artifact
# (14 days), 2DCodePrint-<version>.exe. A pushed `v*` tag matching package.json "version" (e.g.
# v0.3.0) also publishes a GitHub Release with it. Running the workflow by hand on main with "Publish
# release" does the same without pushing a tag: the release job creates tag v<version> on the commit
# it built. To test the release job without publishing, run it by hand with "Release dry run": it
# creates a draft release (never public), checks exactly the .exe and the guide are attached, then
# deletes it. The test job prints docs/brother-p900w-setup.md to Brother-PT-P900W-setup.pdf (one A4
# page, headless Chrome); every release carries it beside the .exe.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release-dry-run:
        description: Release dry run (draft release, deleted again)
        type: boolean
        default: false
      publish-release:
        description: Publish release v<package.json version> from this commit (creates the tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Typecheck and build the webview
        run: npm run build
      - name: Print the Brother PT-P900W guide to one A4 page
        run: |
          node scripts/guide-html.mts "$RUNNER_TEMP/guide.html"
          google-chrome --headless --disable-gpu --no-pdf-header-footer --print-to-pdf=Brother-PT-P900W-setup.pdf "$RUNNER_TEMP/guide.html"
          pages=$(grep -ac '/Type /Page\b' Brother-PT-P900W-setup.pdf)
          if [ "$pages" != 1 ]; then
            echo "::error::The guide prints on $pages pages; shorten docs/brother-p900w-setup.md to one A4 page."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          path: Brother-PT-P900W-setup.pdf
          archive: false
          if-no-files-found: error
          retention-days: 14

  tauri:
    name: Windows Tauri .exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.name.outputs.version }}
      exe: ${{ steps.name.outputs.exe }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Name the .exe
        id: name
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "exe=2DCodePrint-$version.exe" >> "$GITHUB_OUTPUT"
      - name: Rust tests (path scope, error codes, print helpers)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the Tauri .exe
        run: npm run tauri:build
      - name: Name the .exe for the release
        shell: bash
        env:
          EXE: ${{ steps.name.outputs.exe }}
        run: |
          mkdir -p release
          # The cargo package's binary; Tauri builds it with the web app embedded.
          cp src-tauri/target/release/tiny-2dcode.exe "release/$EXE"
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          path: release/${{ steps.name.outputs.exe }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [test, tauri]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.release-dry-run || inputs.publish-release))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.tauri.outputs.version }}
      EXE: ${{ needs.tauri.outputs.exe }}
      GUIDE: Brother-PT-P900W-setup.pdf
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.tauri.outputs.exe }}
      - uses: actions/download-artifact@v8
        with:
          name: Brother-PT-P900W-setup.pdf
      - name: Check the .exe and the guide were downloaded
        run: ls -l "$EXE" "$GUIDE"
      - name: Publish the release
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION. Push tag v$VERSION, or change the version first."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$EXE" "$GUIDE" --verify-tag --generate-notes --title "2D Code Print $GITHUB_REF_NAME"
      - name: Publish the release from a manual run (creates the tag)
        if: github.event_name == 'workflow_dispatch' && inputs.publish-release && !inputs.release-dry-run
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish release only from main (this run is on $GITHUB_REF)."
            exit 1
          fi
          gh release create "v$VERSION" "$EXE" "$GUIDE" --target "$GITHUB_SHA" --generate-notes --title "2D Code Print v$VERSION"
      - name: Dry run (draft release, deleted again)
        if: github.event_name == 'workflow_dispatch' && inputs.release-dry-run
        run: |
          tag="v$VERSION-dry-run.$GITHUB_RUN_ID"
          trap 'gh release delete "$tag" --yes || true' EXIT
          gh release create "$tag" "$EXE" "$GUIDE" --draft --target "$GITHUB_SHA" --generate-notes --title "Dry run $tag"
          gh release view "$tag" --json isDraft,assets --jq '{isDraft, assets: [.assets[] | {name, size}]}'
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(" ")')" = "$EXE $GUIDE"
